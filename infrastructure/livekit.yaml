# Execução nativa LOCAL. No Compose, a configuração equivalente é renderizada
# em configs.livekit.content com os valores do .env, sem gravar segredos no Git.
port: 7880
bind_addresses: [127.0.0.1]
rtc:
  tcp_port: 7881
  udp_port: 7882
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
webhook:
  api_key: subdisc
  urls: [http://127.0.0.1:3000/api/livekit/webhook]
room:
  max_participants: 20
  empty_timeout: 300
logging:
  level: info
  json: true
# Chaves via LIVEKIT_KEYS="subdisc: <seu-segredo>".
