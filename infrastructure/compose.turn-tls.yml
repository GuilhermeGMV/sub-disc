# Use with compose.turn.yml. Certificates must already exist and be renewed externally.
services:
  turn:
    ports:
      - '5349:5349/tcp'
    volumes:
      - ./infrastructure/certs:/certs:ro
    command:
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_DOMAIN:?Configure TURN_DOMAIN}
      - --user=${TURN_USER:?Configure TURN_USER}:${TURN_PASSWORD:?Configure TURN_PASSWORD}
      - --external-ip=${MEDIA_PUBLIC_IP:?Configure MEDIA_PUBLIC_IP}
      - --min-port=52000
      - --max-port=52199
      - --listening-port=3478
      - --tls-listening-port=5349
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --no-cli
      - --no-multicast-peers
