name: subdisc
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
      SETUP_KEY: ${SETUP_KEY:?Configure SETUP_KEY}
      MEDIA_PUBLIC_IP: ${MEDIA_PUBLIC_IP:-}
      MEDIA_ICE_SERVERS: ${MEDIA_ICE_SERVERS:-[]}
      MEDIA_UDP_MIN: 50000
      MEDIA_UDP_MAX: 51999
      DATABASE_URL: sqlite:///data/subdisc.db
      STATIC_DIR: /app/public
      RUST_LOG: subdisc=info
    ports:
      - "50000-51999:50000-51999/udp"
    volumes:
      - app_data:/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_ADDRESS:?Configure APP_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
      - '8080:8080'
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 3s
      retries: 3
  duckdns:
    image: curlimages/curl:8.11.1
    profiles: [duckdns]
    restart: unless-stopped
    entrypoint: [/bin/sh, -c]
    command:
      - |
        [ -n "$$DUCKDNS_DOMAIN" ] && [ -n "$$DUCKDNS_TOKEN" ] || { echo 'Configure DUCKDNS_DOMAIN e DUCKDNS_TOKEN no .env' >&2; exit 1; }
        while :; do
          r=$$(curl -fsS -m 20 "https://www.duckdns.org/update?domains=$$DUCKDNS_DOMAIN&token=$$DUCKDNS_TOKEN") || r=erro
          echo "$$(date -u +%FT%TZ) duckdns: $$r"
          sleep 300
        done
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  app_data:
  caddy_data:
  caddy_config:
